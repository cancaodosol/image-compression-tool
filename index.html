<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画像圧縮</title>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <style>
    body {
      font-family: "Times New Roman", "游明朝", serif;
      background-color: #f8f8f8;
      padding: 30px;
      color: #222;
    }

    h1 {
      font-size: 2.4em;
      border-bottom: 2px solid #000;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .subheadline {
      font-size: 1.2em;
      margin-bottom: 20px;
      font-style: italic;
    }

    .upload-area {
      margin-bottom: 30px;
    }

    input[type="file"] {
      font-size: 0.9em;
      padding: 5px;
    }

    .status {
      margin: 20px 0;
      font-size: 0.9em;
      font-style: italic;
    }

    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      border-top: 1px solid #ccc;
      padding-top: 20px;
    }

    .preview-item {
      border: 1px solid #ddd;
      padding: 10px;
      background-color: #fff;
      max-width: 250px;
      font-size: 0.8em;
      text-align: center;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
    }

    .preview-item img {
      max-width: 100%;
      height: auto;
      margin-bottom: 5px;
      border: 1px solid #ccc;
    }

    .file-info {
      margin-top: 5px;
    }

    .label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>画像圧縮</h1>
  <p class="subheadline">ファイルを選択してください。</p>

  <div class="upload-area">
    <input type="file" id="imageInput" accept="image/*" multiple>
  </div>

  <p id="status" class="status"></p>
  <div id="preview" class="preview"></div>

  <script>
    const input = document.getElementById('imageInput');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    input.addEventListener('change', async (event) => {
      const files = event.target.files;
      if (!files.length) return;

      status.textContent = "圧縮作業を開始しています…";
      preview.innerHTML = "";

      for (const file of files) {
        try {
          const options = {
            maxSizeMB: 0.5,
            useWebWorker: true
          };

          const compressedFile = await imageCompression(file, options);
          const url = URL.createObjectURL(compressedFile);

          // 圧縮率を計算
          const ratio = ((compressedFile.size / file.size) * 100).toFixed(1);

          // ダウンロード処理
          const newFileName = `${file.name.replace(/\.[^/.]+$/, "")}_500kb.${file.name.split('.').pop()}`;
          const link = document.createElement('a');
          link.href = url;
          link.download = newFileName;
          link.click();

          // プレビュー表示
          const item = document.createElement('div');
          item.classList.add('preview-item');
          item.innerHTML = `
            <img src="${url}" alt="compressed image">
            <div class="file-info">
              <div><span class="label">元サイズ:</span> ${(file.size / 1024).toFixed(1)} KB</div>
              <div><span class="label">圧縮後:</span> ${(compressedFile.size / 1024).toFixed(1)} KB</div>
              <div><span class="label">圧縮率:</span> ${ratio}%</div>
            </div>
          `;
          preview.appendChild(item);

        } catch (error) {
          console.error(error);
        }
      }

      status.textContent = "全ての圧縮が完了しました。";
    });
  </script>
</body>
</html>
